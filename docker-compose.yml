services:
  lunchpad:
    build:
      context: .
      args:
        # Stamped into the version badge and an image label. Left as "local"
        # for a plain `docker compose build`, which builds the working tree;
        # scripts/deploy.sh passes the real commit when it deploys origin/main.
        GIT_COMMIT: ${GIT_COMMIT:-local}
    # Named explicitly so scripts/deploy.sh can build and tag this image
    # without depending on the name Compose would otherwise derive from the
    # directory. Same name Compose was already generating.
    image: lunchpadgit-lunchpad:latest
    container_name: lunchpad-container
    ports:
      - "3400:3400"
    volumes:
      - ./data:/app/data
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Configuration lives in .env, which is gitignored. Secrets used to sit in
    # this file, so anyone with the repo held the JWT signing key and could
    # mint an admin token without knowing the PIN. See .env.example.
    env_file:
      - .env
    # Container logs are the only record of rate-limit hits, blocked whitelist
    # attempts and WebSocket churn. Unbounded, they grow until the disk fills.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
