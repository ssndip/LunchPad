<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Pinch zoom stays enabled. `maximum-scale=1.0, user-scalable=no` used to
         be set here, which is defensible on a wall-mounted kiosk but breaks
         WCAG 1.4.4 for the phone/PWA use case the app also serves — a customer
         who needs to magnify the menu simply cannot. Accidental zoom on a fixed
         tablet is handled where it actually occurs instead: `touch-action:
         manipulation` on the controls suppresses double-tap zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LunchPad" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#171717" />
    <meta name="application-name" content="LunchPad" />
    <meta name="msapplication-TileColor" content="#171717" />
    <meta name="msapplication-tap-highlight" content="no" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest?v=3" />
    <title>LunchPad</title>
    <!-- No service-worker registration here on purpose: vite-plugin-pwa injects
         the registerSW.js script tag at build time. A hand-written inline
         registration used to sit alongside it, registering /sw.js a second
         time, and being inline it was also the only thing on this page that a
         Content-Security-Policy could not allow without opening script-src up
         to all inline script. See the CSP in server.ts.
         Keep markup out of this comment - the build's HTML transform picks up
         tag-shaped text even inside comments and emits it for real. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
